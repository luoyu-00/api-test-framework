# 环境配置：用例里不允许出现任何 ip / 端口 / 密码
# 切换环境只改 TEST_ENV 环境变量，不改代码

env: local          # local | ci | staging

envs:
  local:
    sut: 契约模拟器（sut/main.py）
    base_url: http://127.0.0.1:8000
  ci:
    sut: 契约模拟器（CI 内启动）
    base_url: http://127.0.0.1:8000
  staging:
    sut: 真实若依后台（本地 Docker）
    base_url: http://127.0.0.1:8080

timeout: 10
token_scheme: Bearer

accounts:
  admin:
    username: admin
    password: admin123
  # 低权限账号：用于越权用例（真实系统里需要先建一个普通角色用户）
  normal:
    username: test01
    password: admin123

report:
  title: 后台管理系统 接口自动化测试报告
  tester: 罗誉
